name: Release - Build & Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compile source files
        run: |
          mkdir bin
          javac -d bin src/*.java

      - name: Copy resources to classpath
        run: copy Logo.png bin\

      - name: Package JAR
        run: jar --create --file ProteinDomainPredictor.jar --main-class Main -C bin .

      - name: Build portable app-image
        run: >
          jpackage --type app-image
          --dest dist\app-image
          --name "Protein Domain Predictor"
          --input .
          --main-jar ProteinDomainPredictor.jar
          --main-class Main
          --icon Logo.ico
          --vendor "YashK55"
          --description "Graph-based structural protein domain analysis tool"
          --app-version "${{ steps.version.outputs.VERSION }}"

      - name: Compress portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path 'dist\app-image\Protein Domain Predictor' -DestinationPath dist\ProteinDomainPredictor-Portable.zip -Force

      - name: Build EXE installer
        id: exe
        continue-on-error: true
        run: >
          jpackage --type exe
          --dest dist
          --name "Protein Domain Predictor"
          --input .
          --main-jar ProteinDomainPredictor.jar
          --main-class Main
          --icon Logo.ico
          --win-menu --win-shortcut --win-dir-chooser --win-shortcut-prompt
          --vendor "YashK55"
          --description "Graph-based structural protein domain analysis tool"
          --app-version "${{ steps.version.outputs.VERSION }}"

      - name: Rename EXE installer
        if: steps.exe.outcome == 'success'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $exeFile = Get-ChildItem -Path dist -Filter "Protein Domain Predictor-*.exe" | Select-Object -First 1
          if ($exeFile) {
            Move-Item -Path $exeFile.FullName -Destination "dist\ProteinDomainPredictor-Setup.exe" -Force
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $checksums = @()
          Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            $checksums += "$hash  $($_.Name)"
          }
          $checksums | Out-File -FilePath dist\SHA256SUMS.txt -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ProteinDomainPredictor-Portable.zip
            dist/ProteinDomainPredictor-Setup.exe
            dist/SHA256SUMS.txt
