name: CI - Build & Compile

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile source files
        run: |
          mkdir bin
          javac -d bin src/*.java

      - name: Verify JAR creation
        run: jar --create --file ProteinDomainPredictor.jar --main-class Main -C bin .

      - name: Smoke test - JAR manifest
        run: jar --describe-module --file ProteinDomainPredictor.jar || true
